<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Voice of Grower</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BE%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="wordmark"><span class="wordmark-mark">🌾</span> Voice of Grower</a>
    </div>
  </header>

  <main class="admin-shell">
    {% if not authenticated %}
    <div class="admin-card">
      <h2>Admin Login</h2>
      {% if error %}<p class="status-line error-text">{{ error }}</p>{% endif %}
      <form method="post" action="/admin/login">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autofocus>
        <button type="submit">Log in</button>
      </form>
    </div>
    {% else %}
    <div class="admin-card">
      <h2>Dataset Ingestion</h2>
      <p class="admin-status">🟢 Authorized</p>
      <form id="ingest-form">
        <label for="file">Upload Master Performance Log (.xlsx)</label>
        <input type="file" id="file" name="file" accept=".xlsx" required>
        <button type="submit">Process &amp; Ingest</button>
      </form>
      <p id="ingest-status" class="status-line"></p>
      <form method="post" action="/admin/logout" style="margin-top: 1.5rem;">
        <button type="submit" class="danger">Log out</button>
      </form>
    </div>
    <script>
      document.getElementById("ingest-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fileInput = document.getElementById("file");
        const statusEl = document.getElementById("ingest-status");
        if (!fileInput.files.length) return;
        statusEl.textContent = "Processing — this can take a minute...";
        statusEl.className = "status-line";
        const formData = new FormData();
        formData.append("file", fileInput.files[0]);
        try {
          const res = await fetch("/admin/ingest", { method: "POST", body: formData });
          const data = await res.json();
          if (res.ok && data.success) {
            statusEl.textContent = `Done — ingested ${data.total_records} records.`;
            statusEl.className = "status-line success-text";
          } else {
            statusEl.textContent = data.error || "Ingestion failed.";
            statusEl.className = "status-line error-text";
          }
        } catch (err) {
          statusEl.textContent = err.message;
          statusEl.className = "status-line error-text";
        }
      });
    </script>
    {% endif %}
  </main>
</body>
</html>
