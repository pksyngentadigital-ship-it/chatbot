name: CI

# Runs the suite on every push and PR. Without it the tests only ran when
# someone remembered to, so nothing stopped a regression reaching
# production — Vercel deploys straight off main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify the serverless entrypoint imports
        env:
          GROQ_API_KEY: dummy
          PINECONE_API_KEY: dummy
        run: |
          python -c "
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('vog_api', 'api/index.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          routes = sorted(r.path for r in mod.app.routes if hasattr(r, 'path'))
          assert '/api/chat' in routes and '/api/export' in routes, routes
          print('entrypoint OK:', routes)
          "

      - name: Run tests
        run: python -m pytest -q

      - name: Guard against reintroduced credential defaults
        run: |
          if grep -rn --include="*.py" -E '"admin123"|dev-only-secret-change-me' .; then
            echo "::error::A hardcoded credential default was reintroduced."
            exit 1
          fi
          echo "no hardcoded credential defaults"

      - name: Guard the function bundle against heavy dependencies
        run: |
          # pandas alone was 63MB of a 250MB budget, and every one of these
          # is imported on a cold start.
          if grep -qiE '^(pandas|streamlit|torch|scikit-learn|matplotlib|numpy)\b' requirements.txt; then
            echo "::error::A heavy dependency was added to the Vercel function's requirements.txt."
            exit 1
          fi
          echo "requirements.txt is lean"
